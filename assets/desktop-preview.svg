<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Warm Night Arch Linux desktop preview</title>
  <desc id="desc">Stylized preview of Hyprland, Waybar, Kitty and Rofi using a warm red and gold palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2D1F2D"/><stop offset="1" stop-color="#18131b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#E1777D"/><stop offset="1" stop-color="#979367"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1000" cy="560" r="300" fill="#E1777D" opacity=".08"/>
  <circle cx="150" cy="80" r="220" fill="#6CA4B1" opacity=".06"/>
  <rect x="24" y="18" width="1152" height="44" rx="14" fill="#43363f" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="monospace" font-size="16" fill="#E8D5AB"><text x="48" y="46">●  ○  ○  ○  ○</text><text x="565" y="46">12:34</text><text x="930" y="46">NET  CPU  RAM  ⏻</text></g>
  <rect x="72" y="110" width="710" height="460" rx="14" fill="#1e1e1e" stroke="#E1777D" stroke-width="3"/>
  <rect x="95" y="135" width="664" height="34" rx="7" fill="#43363f"/>
  <g font-family="monospace" font-size="18"><text x="114" y="158" fill="#E1777D">arch</text><text x="165" y="158" fill="#E8D5AB">~ hipurbia</text><text x="112" y="215" fill="#979367">$</text><text x="138" y="215" fill="#d4d4d4">./scripts/check.sh</text><text x="112" y="252" fill="#55A185">✓ shell syntax</text><text x="112" y="286" fill="#55A185">✓ package manifests</text><text x="112" y="320" fill="#55A185">✓ privacy scan</text><text x="112" y="354" fill="#55A185">✓ isolated deployment</text></g>
  <rect x="825" y="148" width="300" height="330" rx="14" fill="#2D1F2D" stroke="#E1777D" stroke-width="3"/>
  <rect x="850" y="174" width="250" height="50" rx="9" fill="#43363f" stroke="#979367"/><text x="873" y="206" font-family="monospace" font-size="18" fill="#c0ad95">Type to search...</text>
  <g font-family="monospace" font-size="18"><rect x="850" y="244" width="250" height="44" rx="8" fill="#E1777D"/><text x="875" y="272" fill="#2D1F2D">Terminal</text><text x="875" y="326" fill="#E8D5AB">Browser</text><text x="875" y="380" fill="#E8D5AB">Files</text><text x="875" y="434" fill="#E8D5AB">Editor</text></g>
  <text x="72" y="625" font-family="sans-serif" font-size="26" font-weight="700" fill="#E8D5AB">ARCH LINUX · HYPRLAND · REPRODUCIBLE DOTFILES</text>
</svg>
